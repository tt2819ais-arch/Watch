[project]
name = "watch-backend"
version = "0.2.0"
description = "FastAPI backend for the Watch iOS app — auth, profiles, messages, sync."
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "bcrypt>=4.2",
    "PyJWT>=2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
